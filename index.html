<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Scrimba Unit Converter</title>
</head>
<body>
    <section class="header">
        <h1>Metric/Imperial Unit Conversion</h1>
        <input type="number" name="number" id="input-el">
        <button id="btn-el">Convert</button>
    </section>
    <section class="units">
        <div class="unit">
            <h2>Length (Meter/Feet)</h2>
            <p id="len-el">0 meters = 0 feet | 0 feet = 0 meters</p>
        </div>
        <div class="unit">
            <h2>Volume (Liters/Gallons)</h2>
            <p id="volume-el">0 liters = 0 gallons | 0 gallons = 0 liters</p>
        </div>
        <div class="unit">
            <h2>Mass (Kilograms/Pounds)</h2>
            <p id="mass-el">0 kilos = 0 pounds | 0 pounds = 0 kilos</p>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
